[package]
name = "localllm"
version = "0.1.0"
edition = "2021"

[dependencies]
mistralrs = { version = "0.8", features = ["metal"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
llama-cpp-2 = { version = "0.1.150", features = ["metal"] }
llama-cpp-sys-2 = { version = "0.1.150", features = ["metal"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
dirs = "5"
futures-util = "0.3"

# macOS menu-bar tray (only used when --tray flag is passed)
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
tao = { version = "0.35", default-features = false }
png = "0.17"  # encode the generated icon to PNG for the .app .icns

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.bundle]
name = "localllm"
identifier = "dev.localllm.app"
category = "Developer Tool"
short_description = "Local LLM server with OpenAI/Anthropic API compatibility"
long_description = "Runs a local LLM inference server using llama.cpp with OpenAI and Anthropic API compatibility. Operates as a menu-bar application with no Dock presence."
copyright = "Copyright 2024 localllm contributors"
icon = []
