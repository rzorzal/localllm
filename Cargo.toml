[package]
name = "localllm"
version = "0.1.0"
edition = "2021"

[dependencies]
mistralrs = { version = "0.8", default-features = false }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
llama-cpp-2 = { version = "0.1.150", default-features = false }
llama-cpp-sys-2 = { version = "0.1.150", default-features = false }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
dirs = "5"
toml_edit = "0.22"
futures-util = "0.3"
arc-swap = "1"
# Cross-platform desktop notifications (Linux libnotify/D-Bus, Windows toast,
# macOS native — picks up the .app bundle icon when launched from the bundle).
notify-rust = "4"
# Total physical RAM detection (read once at startup for catalog fit/recommend).
sysinfo = "0.32"
# Cross-platform menu-bar tray + event loop (only active when --tray is passed)
tao = { version = "0.35", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.24", default-features = false }
png = "0.17"
wry = "0.45"

[features]
# Backend selection. Each forwards to BOTH engines so either the Llama
# (default) or Mistralrs engine builds under the chosen backend.
# `common` is llama.cpp's shared utilities (part of its old default set).
metal = ["mistralrs/metal", "llama-cpp-2/metal", "llama-cpp-2/common", "llama-cpp-sys-2/metal"]
cuda  = ["mistralrs/cuda",  "llama-cpp-2/cuda",  "llama-cpp-2/common", "llama-cpp-sys-2/cuda"]
# Portable CPU: no openmp (avoids a libomp system dep), no mkl/accelerate.
# mistralrs stays bare (candle CPU) — it needs no feature for CPU.
cpu   = ["llama-cpp-2/common", "llama-cpp-sys-2/common"]

# Auto-enable Metal on macOS so a plain `cargo build` needs no flags and the
# existing dev/build loop is unchanged. Re-supplies the exact feature set the
# project built with before (metal + llama's default common + openmp). These
# activate the UPSTREAM crates' features directly — they do NOT set this
# crate's own `metal` feature flag (see Task 2's guard).
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { version = "0.8", default-features = false, features = ["metal"] }
llama-cpp-2 = { version = "0.1.150", default-features = false, features = ["metal", "common", "openmp"] }
llama-cpp-sys-2 = { version = "0.1.150", default-features = false, features = ["metal", "common", "openmp"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1

# Dev-iteration release build: same opt level but no LTO and parallel codegen,
# so the final link of the big statically-linked binary takes ~30s instead of
# minutes. Used by `scripts/build-app.sh --fast`. Not for distribution.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[package.metadata.bundle]
name = "localllm"
identifier = "dev.localllm.app"
category = "Developer Tool"
short_description = "Local LLM server with OpenAI/Anthropic API compatibility"
long_description = "Runs a local LLM inference server using llama.cpp with OpenAI and Anthropic API compatibility. Operates as a menu-bar application with no Dock presence."
copyright = "Copyright 2024 localllm contributors"
icon = []
