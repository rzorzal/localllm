name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      # Blocking: the tree is kept at a rustfmt baseline (Fase E2 Task 1).
      - name: Format check
        run: cargo fmt --all --check
      # Informational only — NO `-D warnings`. Surfaces clippy findings in the
      # log without failing CI (user decision, Fase E2 spec).
      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets --features cpu

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    # candle-kernels (mistralrs CUDA dep) runs nvidia-smi at build time to detect
    # the GPU compute capability; hosted runners have no GPU, so we pin it. Only
    # the cuda cells consume this; cpu/metal cells ignore it. 80 = Ampere: the
    # mistralrs afq quant kernel requires sm_80+, so 75/Turing fails to compile.
    # The published cuda binary therefore targets Ampere (RTX 30xx) and newer.
    env:
      CUDA_COMPUTE_CAP: '80'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: metal
            run_tests: true
          - os: ubuntu-latest
            backend: cpu
            run_tests: true
          - os: windows-latest
            backend: cpu
            run_tests: true
          # ubuntu-24.04 (ubuntu-latest) ships gcc-13/14, too new for CUDA 12.5's
          # nvcc host compiler (kernels fail with an empty nvcc error). Pin the
          # Linux cuda cell to 22.04 (gcc-11) for a supported host toolchain.
          - os: ubuntu-22.04
            backend: cuda
            run_tests: false
          - os: windows-latest
            backend: cuda
            run_tests: false
    steps:
      - uses: actions/checkout@v4
      # nvcc on Windows needs MSVC's cl.exe on PATH; expose the dev environment.
      # Pin the 14.39 toolset (VS 17.9): CUDA 12.5 rejects the runner's newer
      # default MSVC ("unsupported Microsoft Visual Studio version").
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.39'
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev cmake libclang-dev
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.0'
          method: network
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.backend }}
      - name: Build
        run: cargo build --features ${{ matrix.backend }}
      # cpu/metal cells run the (pure, model-free) suite; cuda cells are
      # build-only — hosted runners have no NVIDIA driver.
      - name: Test
        if: matrix.run_tests
        run: cargo test --features ${{ matrix.backend }}
