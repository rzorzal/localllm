name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      # Blocking: the tree is kept at a rustfmt baseline (Fase E2 Task 1).
      - name: Format check
        run: cargo fmt --all --check
      # Informational only — NO `-D warnings`. Surfaces clippy findings in the
      # log without failing CI (user decision, Fase E2 spec).
      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets --features cpu

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    # llama-cpp-sys builds ggml's CUDA kernels via cmake. Without an arch pin it
    # compiles for EVERY GPU architecture (~2h). Pin one arch: 80 = Ampere
    # (RTX 30xx and newer) — the published cuda binary targets that floor. Only
    # the cuda cells consume these; cpu/metal cells ignore them.
    env:
      CMAKE_CUDA_ARCHITECTURES: '80'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: metal
            run_tests: true
          - os: ubuntu-latest
            backend: cpu
            run_tests: true
          - os: windows-latest
            backend: cpu
            run_tests: true
          # ubuntu-24.04 (ubuntu-latest) ships gcc-13/14, too new for CUDA 12.5's
          # nvcc host compiler (kernels fail with an empty nvcc error). Pin the
          # Linux cuda cell to 22.04 (gcc-11) for a supported host toolchain.
          - os: ubuntu-22.04
            backend: cuda
            run_tests: false
          # windows-latest now ships VS 2026, which CUDA 12.5 can't detect a CUDA
          # compiler for. Pin the cuda cell to windows-2022 (VS 2022, supported).
          - os: windows-2022
            backend: cuda
            run_tests: false
    steps:
      - uses: actions/checkout@v4
      # Free ~20 GB on the Linux cuda runner: the static cuda binary link
      # otherwise exhausts disk and ld dies with SIGBUS.
      - name: Free disk space (Linux CUDA)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
      # nvcc (Windows CUDA build) needs MSVC's cl.exe on PATH. Only the cuda cell
      # needs it — the cpu cell builds fine with cargo/cmake's native MSVC lookup.
      - name: Set up MSVC (Windows CUDA)
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev cmake libclang-dev
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.0'
          method: network
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.backend }}
      # cpu/metal cells build all targets (they run the test suite next). The
      # build-only cuda cells build just the shippable binary — the diagnostic
      # bins (spike_llama, harvest_quants) would each re-link the huge cuda blob
      # and blow the runner's disk/RAM at link time.
      - name: Build (all targets)
        if: matrix.run_tests
        run: cargo build --features ${{ matrix.backend }}
      - name: Build (binary only)
        if: ${{ !matrix.run_tests }}
        run: cargo build --features ${{ matrix.backend }} --bin localllm
      # cpu/metal cells run the (pure, model-free) suite; cuda cells are
      # build-only — hosted runners have no NVIDIA driver.
      - name: Test
        if: matrix.run_tests
        run: cargo test --features ${{ matrix.backend }}
